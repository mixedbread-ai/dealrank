[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dealrank"
version = "0.1.0"
description = "Parallel listwise reranking with LLMs: deal the candidates, keep a quota, rank the finalists."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mixedbread" }]
requires-python = ">=3.10"
keywords = ["information retrieval", "reranking", "listwise", "large language models", "RankGPT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.50"]
jointrank = ["numpy>=1.24"]
vllm = ["openai>=1.40", "vllm>=0.33"]
experiments = [
    "openai>=1.40",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "ir-measures>=0.3.1",
    "matplotlib>=3.8",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
all = ["dealrank[openai,litellm,jointrank,vllm,experiments]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "numpy>=1.24", "pyyaml>=6.0"]

[project.scripts]
dealrank = "dealrank.cli:main"

[project.urls]
Homepage = "https://www.mixedbread.com"
Repository = "https://github.com/mixedbread-ai/dealrank"
Blog = "https://www.mixedbread.com/blog/dealrank"
Paper = "https://arxiv.org/abs/2611.22392"

[tool.hatch.build.targets.wheel]
packages = ["src/dealrank"]

[tool.hatch.build.targets.sdist]
include = ["src/dealrank", "tests", "experiments", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "experiments/tests"]
pythonpath = ["tests", "experiments"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--doctest-modules --import-mode=importlib"
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B905", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["dealrank", "repro"]
