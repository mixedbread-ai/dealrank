# Local latency on four benchmarks: seconds per query with Qwen3.8-27B served
# locally (bf16, vLLM 0.33, two H100s, tensor parallelism 2, prefix caching
# off), on DL19, DL20, TREC-COVID and Touche (196 queries). One query in
# flight; for each query every method runs back to back in a seeded random
# order; three repeats. BlitzRank is this library's implementation with its
# first calls concurrent, on the retriever's order and on dealt input. This
# config first sends three warm-up queries, whose results are discarded.
#
#   python scripts/serve_vllm.py qwen3.8-27b --gpus 0,1 --port 8000
#   python -m repro.run configs/local_latency.yaml
#
# Expected: 4 methods x 196 queries x 3 repeats = 2,352 reranks and about
# 16,000 calls, about 4 hours on two H100s.

llms: [qwen3.8-27b]
retriever: bm25
benchmarks: [dl19, dl20, covid, touche]
llm_options: {max_concurrency: 128, attempts: 1}

schedules:
  - {type: dealrank, window: 20, quota: 4}
  - {type: blitzrank, window: 20, top_m: 10, input_order: retriever, concurrent_cover: true}
  - {type: blitzrank, window: 20, top_m: 10, input_order: dealt, concurrent_cover: true}
  - {type: sliding_window, window: 20, stride: 10}

timing:
  repeats: 3
  seed: 50
  warmup_queries: 3
