# The LLMs of the paper (Table 2) and how to reach them.
#
# Every model gets the same prompt (RankGPT permutation prompt), the same
# parser and the same decoding regime below. Runs of the BlitzRank authors'
# package (`type: blitzrank_package`) keep the decoding regime but build the
# prompt and parse the answer with the package's own code. API models are called through
# OpenRouter (key in OPENROUTER_API_KEY); the local model is served by vLLM
# (see scripts/serve_vllm.py). `repro.models.build_llm` turns an entry into a
# dealrank ListwiseLLM.
#
# Entry fields:
#   label        name used in tables
#   backend      openrouter | vllm
#   id           model id as the endpoint expects it
#   reasoning    OpenRouter reasoning setting (default: {enabled: false})
#   provider     OpenRouter provider routing, e.g. {ignore: [...]}
#   price_per_m  USD per million input / output tokens on OpenRouter, for cost estimates
#   revision, serve, base_url   local models only

decoding:
  temperature: 0.0
  seed: 42
  max_output_tokens: 1024
  max_passage_words: 300

models:
  deepseek-v4-flash:
    label: DeepSeek V4-Flash
    backend: openrouter
    id: deepseek/deepseek-v4-flash
    price_per_m: {input: 0.09, output: 0.18}

  qwen3.5-35b-a3b:
    label: Qwen3.5-35B-A3B
    backend: openrouter
    id: qwen/qwen3.5-35b-a3b
    price_per_m: {input: 0.14, output: 1.00}

  kimi-k2.6:
    label: Kimi K2.6
    backend: openrouter
    id: moonshotai/kimi-k2.6
    provider: {ignore: [DigitalOcean, Venice]}
    price_per_m: {input: 0.66, output: 3.41}

  glm-5.2:
    label: GLM-5.2
    backend: openrouter
    id: z-ai/glm-5.2
    provider: {ignore: [GMICloud, DigitalOcean]}
    price_per_m: {input: 0.54, output: 1.76}

  gemini-3-flash:
    label: Gemini 3 Flash
    backend: openrouter
    id: google/gemini-3-flash-preview
    price_per_m: {input: 0.50, output: 3.00}

  qwen3.8-27b:
    label: Qwen3.8-27B
    backend: vllm
    id: Qwen/Qwen3.8-27B
    revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    base_url: http://127.0.0.1:8000/v1
    serve:
      vllm_version: "0.33"
      dtype: bfloat16
      tensor_parallel_size: 2
      prefix_caching: false
      max_model_len: 65536
      gpu_memory_utilization: 0.90
      seed: 42
    price_per_m: {input: 0.0, output: 0.0}

  gpt-5.5:
    label: GPT-5.5
    backend: openrouter
    id: openai/gpt-5.5
    price_per_m: {input: 5.00, output: 30.00}
