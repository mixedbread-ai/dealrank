# Throughput under load: 8 and 32 queries in flight against the local
# Qwen3.8-27B server, on DL19, DL20, TREC-COVID and Touche (196 queries). Each
# method runs as a block over all queries of a benchmark with a closed loop of
# Q workers, in a seeded order of methods per repeat; once every query has
# started, the workers keep Q queries in flight with repeated queries until the
# last one ends, so the load stays at Q. Records of the 8-query blocks are
# repeats 1 to 3, those of the 32-query blocks repeats 4 to 6; every record
# carries `timing.queries_in_flight`, and every block's throughput is in
# runs/load/blocks.jsonl.
#
# The paper's three repeats of each level each ran on a separate server
# instance, so that the interval over repeats includes the variation between
# instances. To do the same, restart the server between instances:
#
#   python scripts/serve_vllm.py qwen3.8-27b --gpus 0,1 --port 8000
#   python -m repro.timing configs/load.yaml --repeat 1     # 8 in flight, first instance
#   python -m repro.timing configs/load.yaml --repeat 4     # 32 in flight, first instance
#   # then repeats 2 and 5 on a fresh server, and 3 and 6 on another
#
# `python -m repro.run configs/load.yaml` runs the six repeats on one server.
#
# Expected: about 70 minutes per instance on two H100s.

llms: [qwen3.8-27b]
retriever: bm25
benchmarks: [dl19, dl20, covid, touche]
llm_options: {max_concurrency: 1024, attempts: 1}

schedules:
  - {type: dealrank, window: 20, quota: 4}
  - {type: blitzrank, window: 20, top_m: 10, input_order: retriever, concurrent_cover: true}
  - {type: blitzrank, window: 20, top_m: 10, input_order: dealt, concurrent_cover: true}
  - {type: sliding_window, window: 20, stride: 10}

timing:
  - {queries_in_flight: 8, repeats: [1, 2, 3], seed: 50, warmup_queries: 8}
  - {queries_in_flight: 32, repeats: [4, 5, 6], seed: 50, warmup_queries: 8}
