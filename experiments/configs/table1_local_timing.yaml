# Table 1, p50 and p90 columns, and the 100-candidate row of Table 3: seconds
# per DL19 query with Qwen3.8-27B served locally (bf16, vLLM 0.33, two H100s,
# tensor parallelism 2, prefix caching off). One query in flight; for each
# query every method runs back to back in a seeded random order; three
# repeats, after a warm-up of five queries whose results are discarded.
#
# Table 1: BlitzRank w=20 is the authors' package, with every call in turn and
# with its first calls concurrent; w=10 and dealt input use this library's
# implementation. The
# contiguous-chunk and random-partition rows make DealRank's calls on another
# split, so Table 1 shows DealRank's timings for them.
# Table 3: its BlitzRank columns at 100 candidates are this library's
# implementation on the retriever's order, with concurrent first calls and
# with every call in turn, as at 500 and 1,000 candidates.
#
#   python scripts/serve_vllm.py qwen3.8-27b --gpus 0,1 --port 8000
#   python -m repro.run configs/table1_local_timing.yaml
#
# Expected: 12 methods x 43 queries x 3 repeats = 1,548 reranks and about
# 13,000 calls, about 2 hours on two H100s.

llms: [qwen3.8-27b]
retriever: bm25
benchmarks: [dl19]
llm_options: {max_concurrency: 128, attempts: 1}

schedules:
  - {type: dealrank, window: 20, quota: 4}
  - {type: blitzrank, window: 20, top_m: 10, input_order: dealt, concurrent_cover: true}
  - {type: blitzrank, window: 10, top_m: 10, input_order: retriever}
  - {type: blitzrank, window: 20, top_m: 10, input_order: retriever}
  - {type: blitzrank, window: 20, top_m: 10, input_order: retriever, concurrent_cover: true}
  - {type: blitzrank_package, window: 20, top_m: 10}
  - {type: blitzrank_package, window: 20, top_m: 10, concurrent_cover: true}
  - {type: tourrank, tournaments: 1}
  - {type: sliding_window, window: 20, stride: 10}
  - {type: top_prefix, size: 20}
  - {type: tdpart, window: 20, cutoff: 10, budget: 20}
  - {type: jointrank, window: 20, replicates: 4}

timing:
  repeats: 3
  seed: 37
  warmup_queries: 5
