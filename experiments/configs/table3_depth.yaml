# Table 3, deeper lists: 500 and 1,000 BM25 candidates on DL19, DL20, DBpedia
# and SciFact (797 queries), Qwen3.8-27B served locally. Hierarchical DealRank
# deals into 25 hands that keep 3, then 4 hands that keep 5 (500 candidates),
# or into 50 hands that keep 2, then 5 hands that keep 4 (1,000), before one
# final call. It is compared with BlitzRank w=20, with its first calls
# concurrent and with every call in turn, and with the sliding window. Both
# BlitzRank variants make the same calls and return the same ranking, so the
# quality grids run only the concurrent one. The grids give nDCG@10; the
# timing blocks give seconds and rounds per DL19 query, one query in flight,
# methods interleaved per query (three repeats; one for the slow sequential
# arms). The table's 100-candidate row comes from table2_models.yaml (nDCG@10)
# and table1_local_timing.yaml (seconds).
#
#   python scripts/serve_vllm.py qwen3.8-27b --gpus 0,1 --port 8000
#   python -m repro.run configs/table3_depth.yaml
#
# Needs the BM25 top-1,000 pools (python -m repro.data deep).
# Expected: about 250,000 calls for quality (about 40 hours on two H100s) and
# 32,000 for timing (about 5 hours).

llms: [qwen3.8-27b]
retriever: bm25-top1000
benchmarks: all
query_concurrency: 48
llm_options: {max_concurrency: 256}

schedules:
  - &dealrank500 {type: dealrank_hierarchical, window: 20, first_quota: 3}
  - &dealrank1000 {type: dealrank_hierarchical, window: 20, first_quota: 2}
  - &blitz {type: blitzrank, window: 20, top_m: 10, input_order: retriever}
  - &blitz_concurrent {type: blitzrank, window: 20, top_m: 10, input_order: retriever, concurrent_cover: true}
  - &window {type: sliding_window, window: 20, stride: 10}

grids:
  - depth: 500
    schedules: [*dealrank500, *blitz_concurrent, *window]
  - depth: 1000
    schedules: [*dealrank1000, *blitz_concurrent, *window]

timing:
  - &timing_dl19 {benchmarks: [dl19], depth: 500, repeats: 3, seed: 38, warmup_queries: 5,
                  llm_options: {max_concurrency: 128, attempts: 1},
                  schedules: [*dealrank500, *blitz_concurrent]}
  - {<<: *timing_dl19, depth: 1000, schedules: [*dealrank1000, *blitz_concurrent]}
  - {<<: *timing_dl19, depth: 500, repeats: 1, schedules: [*blitz, *window]}
  - {<<: *timing_dl19, depth: 1000, repeats: 1, schedules: [*blitz, *window]}
